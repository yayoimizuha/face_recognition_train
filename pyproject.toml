[project]
name = "face-recognition-train"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy~=2.3",
    "Pillow~=11.3",
    "tqdm~=4.67",
    "torch~=2.8",
    "torchvision~=0.23",
    "scikit-learn~=1.7",
    "scikit-image~=0.25",
    "onnxruntime-gpu~=1.23",
    "onnx~=1.19",
    "pandas~=2.3",
    "opencv-python~=4.11",
    "timm~=1.0",
    "easydict~=1.13",
    "nvidia-dali-cuda120~=1.51; sys_platform != 'win32'",
    "ptflops~=0.7",
    "menpo~=0.11",
    "prettytable~=3.16",
    "tensorboard~=2.20",
    "wandb~=0.22",
    "python-dotenv~=1.1",
    "webdataset~=1.0",
    "datasets~=4.1",
    "transformers~=4.57",
    "mkl~=2025.2",
    "schedulefree~=1.4",
    "pytorch-lamb~=1.0",
#    "intel-extension-for-pytorch"
]

[[tool.uv.index]]
name = "torch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "torch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true


[[tool.uv.index]]
name = "torch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi-nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[[tool.uv.index]]
name = "ipex"
url = "https://pytorch-extension.intel.com/release-whl/stable/cpu/us/"
explicit = true

[tool.uv.sources]
torch = [{ index = "torch-cu129" }]
torchvision = [{ index = "torch-cu129" }]
nvidia-dali-cuda120 = [{ index = "pypi-nvidia" }]
intel-extension-for-pytorch = [{ index = "ipex" }]

