[project]
name = "face-recognition-train"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy~=2.3",
    "Pillow~=11.2",
    "tqdm~=4.67",
    "torch~=2.6",
    "torchvision~=0.22",
    "scikit-learn~=1.7",
    "scikit-image~=0.25",
    "onnxruntime-gpu~=1.22",
    "onnx~=1.18",
    "pandas~=2.3",
    "opencv-python~=4.11",
    "timm~=1.0",
    "easydict~=1.13",
    "nvidia-dali-cuda120~=1.50;sys_platform != 'win32'",
    "ptflops~=0.7",
    "menpo~=0.11",
    "prettytable==3.16.0",
    "tensorboard~=2.19",
    "wandb~=0.20",
    "python-dotenv~=1.1"
]

[[tool.uv.index]]
name = "torch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pypi-nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
torch = [{ index = "torch-cu128" }]
torchvision = [{ index = "torch-cu128" }]
nvidia-dali-cuda120 = [{ index = "pypi-nvidia" }]